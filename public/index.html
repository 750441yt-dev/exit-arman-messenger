<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EXIT ARMAN INSIDE</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:Inter,Arial,Helvetica,sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(0,174,255,.18),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 85%,
      rgba(132,55,255,.20),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #03060d,
      #07101e 50%,
      #04050c
    );

  display:flex;
  justify-content:center;
  padding:30px 16px;
}

.wrapper{
  width:100%;
  max-width:650px;
}

/* =====================
   HEADER
===================== */

.header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  position:relative;
  display:inline-block;

  font-size:42px;
  font-weight:950;
  letter-spacing:5px;

  color:#fff;

  text-shadow:
    0 0 5px rgba(100,210,255,.9),
    0 0 15px rgba(70,170,255,.8),
    0 0 35px rgba(110,75,255,.7),
    0 0 65px rgba(130,60,255,.5);

  animation:glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow{
  from{
    text-shadow:
      0 0 5px rgba(100,210,255,.7),
      0 0 15px rgba(70,170,255,.6),
      0 0 30px rgba(110,75,255,.5);
  }

  to{
    text-shadow:
      0 0 8px rgba(120,225,255,1),
      0 0 22px rgba(75,170,255,.9),
      0 0 45px rgba(125,70,255,.8),
      0 0 75px rgba(145,60,255,.5);
  }
}

.subtitle{
  margin-top:9px;
  color:#9aa9bf;
  font-size:13px;
  letter-spacing:2px;
}

/* =====================
   CARD
===================== */

.card{
  padding:28px;

  border-radius:27px;

  border:1px solid
  rgba(255,255,255,.11);

  background:
    linear-gradient(
      145deg,
      rgba(17,25,43,.88),
      rgba(5,9,18,.90)
    );

  backdrop-filter:blur(22px);

  box-shadow:
    0 30px 100px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.04);
}

/* =====================
   SECTION
===================== */

.section{
  margin-bottom:23px;
}

.section-title{
  margin-bottom:9px;

  color:#aebbd0;

  font-size:12px;
  font-weight:800;

  letter-spacing:1.4px;
  text-transform:uppercase;
}

/* =====================
   INPUTS
===================== */

input[type="text"]{
  width:100%;

  padding:15px 16px;

  border-radius:14px;

  border:1px solid #273653;

  outline:none;

  background:#060b15;

  color:#fff;

  font-size:14px;

  transition:.2s;
}

input[type="text"]::placeholder{
  color:#66758d;
}

input[type="text"]:focus{
  border-color:#5d7cff;

  box-shadow:
    0 0 0 3px rgba(93,124,255,.10),
    0 0 20px rgba(75,110,255,.12);
}

/* =====================
   FILE
===================== */

.file-box{
  padding:19px;

  border-radius:16px;

  border:1px dashed #40516d;

  background:#060b15;
}

input[type="file"]{
  width:100%;
  color:#c8d4e5;
}

/* =====================
   BUTTONS
===================== */

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-top:8px;
}

button{
  width:100%;

  border:0;

  border-radius:14px;

  padding:15px;

  color:white;

  font-size:14px;
  font-weight:850;

  cursor:pointer;

  transition:
    transform .15s,
    filter .15s;
}

button:hover{
  filter:brightness(1.12);
}

button:active{
  transform:scale(.98);
}

.upload{
  background:
    linear-gradient(
      135deg,
      #00a978,
      #087cff
    );
}

.start{
  background:
    linear-gradient(
      135deg,
      #087cff,
      #7544ff
    );
}

.stop{
  background:#182235;
}

/* =====================
   PREVIEW
===================== */

.preview{
  display:none;

  margin-top:18px;

  padding:15px;

  border-radius:16px;

  background:#060b15;

  border:1px solid rgba(255,255,255,.07);
}

.preview img{
  width:100%;
  max-height:350px;

  object-fit:contain;

  border-radius:12px;
}

.filename{
  margin-top:11px;

  color:#aebed4;

  font-size:13px;

  word-break:break-word;
}

.textpreview{
  display:none;

  margin-top:12px;

  max-height:260px;

  overflow:auto;

  padding:14px;

  border-radius:11px;

  background:#03070e;

  color:#d0d9e7;

  white-space:pre-wrap;

  word-break:break-word;

  font-family:monospace;

  font-size:12px;

  line-height:1.55;
}

/* =====================
   RESULT
===================== */

.result{
  margin-top:17px;

  padding:14px;

  border-radius:13px;

  background:#060b15;

  border:1px solid rgba(255,255,255,.06);

  color:#9eafc7;

  font-size:13px;

  line-height:1.5;

  word-break:break-word;
}

.result a{
  color:#62d4ff;
}

/* =====================
   STATUS
===================== */

.status{
  margin-top:17px;

  padding:15px 16px;

  border-radius:14px;

  background:#060b15;

  border:1px solid rgba(255,255,255,.06);

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.status-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#777;
}

.dot.online{
  background:#20e58a;

  box-shadow:
    0 0 8px #20e58a,
    0 0 18px rgba(32,229,138,.6);
}

#statusText{
  font-size:12px;
  font-weight:800;
  letter-spacing:.6px;
}

#uptime{
  color:#8999b0;
  font-family:monospace;
  font-size:12px;
}

/* =====================
   FOOTER
===================== */

.footer{
  text-align:center;

  margin-top:20px;

  color:#64738b;

  font-size:11px;

  letter-spacing:1px;
}

/* =====================
   MOBILE
===================== */

@media(max-width:520px){

  .logo{
    font-size:29px;
    letter-spacing:3px;
  }

  .card{
    padding:20px;
  }

  .buttons{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="wrapper">

  <div class="header">

    <div class="logo">
      EXIT ARMAN INSIDE
    </div>

    <div class="subtitle">
      MESSENGER AUTOMATION SERVER
    </div>

  </div>


  <div class="card">


    <!-- FACEBOOK PAGE URL -->

    <div class="section">

      <div class="section-title">
        Facebook Page URL
      </div>

      <input
        type="text"
        id="pageUrl"
        placeholder="https://facebook.com/your-page"
      >

    </div>


    <!-- MESSENGER URL -->

    <div class="section">

      <div class="section-title">
        Messenger Chat URL
      </div>

      <input
        type="text"
        id="chatUrl"
        placeholder="https://m.me/your-page"
      >

    </div>


    <!-- RECIPIENT ID -->

    <div class="section">

      <div class="section-title">
        Authorized Recipient ID
      </div>

      <input
        type="text"
        id="recipientId"
        placeholder="Messenger recipient ID"
      >

    </div>


    <!-- FILE -->

    <div class="section">

      <div class="section-title">
        Select File
      </div>

      <div class="file-box">

        <input
          type="file"
          id="file"
          accept="*/*"
          onchange="previewFile()"
        >

      </div>

      <button
        class="upload"
        onclick="uploadFile()"
      >
        📤 UPLOAD FILE
      </button>

    </div>


    <!-- PREVIEW -->

    <div
      id="preview"
      class="preview"
    >

      <div id="imagePreview"></div>

      <div
        id="textPreview"
        class="textpreview"
      ></div>

      <div
        id="filename"
        class="filename"
      ></div>

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="result"
    >
      Select a file to begin.
    </div>


    <!-- START STOP -->

    <div class="buttons">

      <button
        class="start"
        onclick="startServer()"
      >
        🚀 START
      </button>

      <button
        class="stop"
        onclick="stopServer()"
      >
        ⏹ STOP
      </button>

    </div>


    <!-- STATUS -->

    <div class="status">

      <div class="status-left">

        <span
          id="dot"
          class="dot"
        ></span>

        <span id="statusText">
          SERVER OFFLINE
        </span>

      </div>

      <span id="uptime">
        00:00:00
      </span>

    </div>

  </div>


  <div class="footer">
    DESIGN BY EXIT ARMAN
  </div>

</div>


<script>

let selectedText = "";
let statusTimer = null;


// ==========================
// FILE PREVIEW
// ==========================

async function previewFile(){

  const file =
    document.getElementById("file")
      .files[0];

  const preview =
    document.getElementById("preview");

  const imagePreview =
    document.getElementById(
      "imagePreview"
    );

  const textPreview =
    document.getElementById(
      "textPreview"
    );

  const filename =
    document.getElementById(
      "filename"
    );

  selectedText = "";

  imagePreview.innerHTML = "";

  textPreview.textContent = "";

  textPreview.style.display =
    "none";


  if(!file){

    preview.style.display =
      "none";

    return;
  }


  preview.style.display =
    "block";

  filename.textContent =
    "📄 " + file.name;


  // IMAGE

  if(file.type.startsWith("image/")){

    const imageUrl =
      URL.createObjectURL(file);

    imagePreview.innerHTML =
      `
      <img
        src="${imageUrl}"
        alt="File Preview"
      >
      `;

    return;
  }


  // TEXT

  if(
    file.type.startsWith("text/") ||
    file.name.endsWith(".txt") ||
    file.name.endsWith(".csv") ||
    file.name.endsWith(".json")
  ){

    try{

      selectedText =
        await file.text();

      textPreview.textContent =
        selectedText;

      textPreview.style.display =
        "block";

    }catch(error){

      textPreview.textContent =
        "Text read nahi ho saka.";

      textPreview.style.display =
        "block";
    }

  }

}


// ==========================
// UPLOAD
// ==========================

async function uploadFile(){

  const file =
    document.getElementById("file")
      .files[0];

  const result =
    document.getElementById("result");

  if(!file){

    result.textContent =
      "❌ Pehle file select karo.";

    return;
  }


  result.textContent =
    "⏳ Uploading...";


  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "message",
    selectedText
  );


  try{

    const response =
      await fetch(
        "/api/upload",
        {
          method:"POST",
          body:formData
        }
      );

    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Upload failed."
      );

    }


    result.innerHTML =
      `
      ✅ <b>Upload successful</b><br><br>

      📄 ${data.filename}<br><br>

      🔗
      <a
        href="${data.url}"
        target="_blank"
      >
        Open uploaded file
      </a>
      `;

  }catch(error){

    result.textContent =
      "❌ " + error.message;

  }

}


// ==========================
// START
// ==========================

async function startServer(){

  const result =
    document.getElementById(
      "result"
    );

  const pageUrl =
    document.getElementById(
      "pageUrl"
    ).value.trim();

  const chatUrl =
    document.getElementById(
      "chatUrl"
    ).value.trim();

  const recipientId =
    document.getElementById(
      "recipientId"
    ).value.trim();


  if(!pageUrl){

    result.textContent =
      "❌ Facebook Page URL enter karo.";

    return;
  }

  if(!chatUrl){

    result.textContent =
      "❌ Messenger Chat URL enter karo.";

    return;
  }

  if(!recipientId){

    result.textContent =
      "❌ Authorized Recipient ID enter karo.";

    return;
  }


  result.textContent =
    "⏳ Starting server...";


  try{

    const response =
      await fetch(
        "/api/start",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            pageUrl,
            chatUrl,
            recipientId
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Start failed."
      );

    }


    result.textContent =
      "✅ " + data.message;

    updateStatus();

  }catch(error){

    result.textContent =
      "❌ " + error.message;

  }

}


// ==========================
// STOP
// ==========================

async function stopServer(){

  try{

    const response =
      await fetch(
        "/api/stop",
        {
          method:"POST"
        }
      );

    const data =
      await response.json();

    document.getElementById(
      "result"
    ).textContent =
      "⏹ " + data.message;

    updateStatus();

  }catch(error){

    document.getElementById(
      "result"
    ).textContent =
      "❌ Stop failed.";

  }

}


// ==========================
// STATUS
// ==========================

async function updateStatus(){

  try{

    const response =
      await fetch(
        "/api/status"
      );

    const data =
      await response.json();


    const dot =
      document.getElementById(
        "dot"
      );

    const status =
      document.getElementById(
        "statusText"
      );

    const uptime =
      document.getElementById(
        "uptime"
      );


    if(data.running){

      dot.classList.add(
        "online"
      );

      status.textContent =
        "SERVER RUNNING";


      clearInterval(
        statusTimer
      );


      statusTimer =
        setInterval(() => {

          if(data.startedAt){

            uptime.textContent =
              formatTime(
                Date.now() -
                data.startedAt
              );

          }

        },1000);

    }else{

      dot.classList.remove(
        "online"
      );

      status.textContent =
        "SERVER OFFLINE";

      uptime.textContent =
        "00:00:00";

      clearInterval(
        statusTimer
      );

    }

  }catch(error){

    document.getElementById(
      "statusText"
    ).textContent =
      "SERVER ERROR";

  }

}


// ==========================
// TIME
// ==========================

function formatTime(ms){

  let seconds =
    Math.floor(ms / 1000);

  let hours =
    Math.floor(seconds / 3600);

  let minutes =
    Math.floor(
      (seconds % 3600) / 60
    );

  seconds =
    seconds % 60;


  return (
    String(hours).padStart(2,"0")
    + ":" +
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0")
  );

}


// Initial status
updateStatus();

</script>

</body>
</html>
