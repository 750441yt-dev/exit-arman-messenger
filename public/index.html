<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>EXIT ARMAN</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  font-family:Arial,sans-serif;

  color:white;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(0,170,255,.18),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 90%,
      rgba(130,60,255,.20),
      transparent 35%
    ),
    #050812;
}

.app{
  width:100%;
  max-width:570px;
}

.logo{
  text-align:center;

  margin-bottom:25px;

  font-size:55px;
  font-weight:900;

  letter-spacing:5px;

  color:#fff;

  transform:
    perspective(500px)
    rotateX(8deg);

  text-shadow:
    1px 1px 0 #64748b,
    2px 2px 0 #475569,
    4px 4px 0 #334155,
    0 0 12px #55d8ff,
    0 0 30px #596cff,
    0 0 55px #8a55ff;

  animation:glow 2.5s infinite alternate;
}

@keyframes glow{

  from{
    filter:brightness(.9);
  }

  to{
    filter:brightness(1.25);
  }

}

.card{
  padding:25px;

  border-radius:24px;

  background:
    rgba(8,14,27,.88);

  border:
    1px solid
    rgba(255,255,255,.1);

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.55);
}

.label{
  margin-bottom:9px;

  color:#aebbd0;

  font-size:12px;
  font-weight:bold;

  letter-spacing:1px;
  text-transform:uppercase;
}

input[type=text]{
  width:100%;

  padding:15px;

  border-radius:13px;

  border:1px solid #293854;

  outline:none;

  background:#060b15;

  color:white;

  font-size:14px;
}

input[type=text]:focus{
  border-color:#657cff;

  box-shadow:
    0 0 18px
    rgba(85,110,255,.18);
}

.file{
  padding:18px;

  border-radius:14px;

  border:1px dashed #40516c;

  background:#060b15;
}

input[type=file]{
  width:100%;
  color:#c8d4e5;
}

button{
  width:100%;

  padding:15px;

  margin-top:12px;

  border:0;

  border-radius:13px;

  color:white;

  font-size:14px;
  font-weight:800;

  cursor:pointer;
}

.upload{
  background:
    linear-gradient(
      135deg,
      #00a878,
      #087cff
    );
}

.start{
  background:
    linear-gradient(
      135deg,
      #087cff,
      #7546ff
    );
}

.stop{
  background:#1a2537;
}

.preview{
  display:none;

  margin-top:17px;

  padding:15px;

  border-radius:15px;

  background:#060b15;
}

.preview img{
  width:100%;
  max-height:330px;

  object-fit:contain;

  border-radius:11px;
}

.filename{
  margin-top:10px;

  color:#aebed4;

  font-size:13px;
}

.text{
  margin-top:10px;

  max-height:250px;

  overflow:auto;

  padding:13px;

  border-radius:10px;

  background:#03070e;

  color:#d3dce8;

  white-space:pre-wrap;

  font-family:monospace;

  font-size:12px;

  line-height:1.5;
}

.result{
  margin-top:16px;

  padding:14px;

  border-radius:12px;

  background:#060b15;

  color:#a1b1c8;

  font-size:13px;

  word-break:break-word;
}

.result a{
  color:#5fd4ff;
}

.status{
  margin-top:16px;

  padding:14px;

  border-radius:13px;

  background:#060b15;

  display:flex;

  justify-content:space-between;
}

.dot{
  display:inline-block;

  width:9px;
  height:9px;

  margin-right:7px;

  border-radius:50%;

  background:#777;
}

.dot.online{
  background:#20e58a;

  box-shadow:
    0 0 15px #20e58a;
}

.footer{
  margin-top:17px;

  text-align:center;

  color:#63718a;

  font-size:11px;
}

</style>

</head>

<body>

<div class="app">

<div class="logo">
EXIT ARMAN
</div>


<div class="card">

<div class="label">
URL
</div>

<input
  type="text"
  id="targetUrl"
  placeholder="Paste Page / Chat / Group URL"
>


<div class="label" style="margin-top:20px;">
File
</div>

<div class="file">

<input
  type="file"
  id="file"
  accept="*/*"
  onchange="previewFile()"
>

</div>


<button
  class="upload"
  onclick="uploadFile()"
>
📤 UPLOAD FILE
</button>


<div
  class="preview"
  id="preview"
>

<div id="imagePreview"></div>

<div
  class="text"
  id="textPreview"
></div>

<div
  class="filename"
  id="filename"
></div>

</div>


<div
  class="result"
  id="result"
>
Ready.
</div>


<button
  class="start"
  onclick="startServer()"
>
🚀 START
</button>


<button
  class="stop"
  onclick="stopServer()"
>
⏹ STOP
</button>


<div class="status">

<div>

<span
  class="dot"
  id="dot"
></span>

<span id="statusText">
OFFLINE
</span>

</div>

<span id="uptime">
00:00:00
</span>

</div>

</div>


<div class="footer">
DESIGN BY EXIT ARMAN
</div>

</div>


<script>

let selectedText = "";
let timer = null;


async function previewFile(){

  const file =
    document.getElementById(
      "file"
    ).files[0];

  const preview =
    document.getElementById(
      "preview"
    );

  const image =
    document.getElementById(
      "imagePreview"
    );

  const text =
    document.getElementById(
      "textPreview"
    );

  const filename =
    document.getElementById(
      "filename"
    );

  if(!file){

    preview.style.display =
      "none";

    return;
  }

  preview.style.display =
    "block";

  image.innerHTML = "";
  text.textContent = "";

  filename.textContent =
    "📄 " + file.name;

  selectedText = "";


  if(file.type.startsWith("image/")){

    const url =
      URL.createObjectURL(file);

    image.innerHTML =
      `<img src="${url}">`;

    return;
  }


  if(
    file.type.startsWith("text/") ||
    file.name.endsWith(".txt") ||
    file.name.endsWith(".csv") ||
    file.name.endsWith(".json")
  ){

    selectedText =
      await file.text();

    text.textContent =
      selectedText;

  }

}


async function uploadFile(){

  const file =
    document.getElementById(
      "file"
    ).files[0];

  const result =
    document.getElementById(
      "result"
    );

  if(!file){

    result.textContent =
      "❌ File select karo.";

    return;
  }


  result.textContent =
    "⏳ Uploading...";


  const form =
    new FormData();

  form.append(
    "file",
    file
  );

  try{

    const response =
      await fetch(
        "/api/upload",
        {
          method:"POST",
          body:form
        }
      );

    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Upload failed."
      );

    }


    result.innerHTML =
      `
      ✅ File uploaded<br><br>
      ${data.filename}<br><br>
      <a
        href="${data.url}"
        target="_blank"
      >
        Open File
      </a>
      `;

  }catch(error){

    result.textContent =
      "❌ " +
      error.message;

  }

}


async function startServer(){

  const url =
    document.getElementById(
      "targetUrl"
    ).value.trim();

  const result =
    document.getElementById(
      "result"
    );

  if(!url){

    result.textContent =
      "❌ URL enter karo.";

    return;
  }


  try{

    const response =
      await fetch(
        "/api/start",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            url:url
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error
      );

    }


    result.textContent =
      "✅ Server started.";

    updateStatus();

  }catch(error){

    result.textContent =
      "❌ " +
      error.message;

  }

}


async function stopServer(){

  await fetch(
    "/api/stop",
    {
      method:"POST"
    }
  );

  updateStatus();

}


async function updateStatus(){

  try{

    const response =
      await fetch(
        "/api/status"
      );

    const data =
      await response.json();


    const dot =
      document.getElementById(
        "dot"
      );

    const status =
      document.getElementById(
        "statusText"
      );

    const uptime =
      document.getElementById(
        "uptime"
      );


    if(data.running){

      dot.classList.add(
        "online"
      );

      status.textContent =
        "RUNNING";

      clearInterval(timer);

      timer =
        setInterval(() => {

          if(data.startedAt){

            uptime.textContent =
              formatTime(
                Date.now() -
                data.startedAt
              );

          }

        },1000);

    }else{

      dot.classList.remove(
        "online"
      );

      status.textContent =
        "OFFLINE";

      uptime.textContent =
        "00:00:00";

      clearInterval(timer);

    }

  }catch(error){

    document.getElementById(
      "statusText"
    ).textContent =
      "ERROR";

  }

}


function formatTime(ms){

  let seconds =
    Math.floor(ms / 1000);

  let hours =
    Math.floor(seconds / 3600);

  let minutes =
    Math.floor(
      (seconds % 3600) / 60
    );

  seconds =
    seconds % 60;


  return (
    String(hours).padStart(2,"0")
    + ":" +
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0")
  );

}


updateStatus();

</script>

</body>
</html>
