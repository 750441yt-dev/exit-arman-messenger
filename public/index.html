<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>EXIT ARMAN INSIDE</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(0,170,255,.20),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 85%,
      rgba(135,55,255,.20),
      transparent 35%
    ),
    #040711;

  display:flex;
  justify-content:center;

  padding:30px 16px;
}

.app{
  width:100%;
  max-width:650px;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:4px;

  color:#fff;

  text-shadow:
    0 0 7px #58d9ff,
    0 0 18px #3da8ff,
    0 0 35px #755cff,
    0 0 65px rgba(117,92,255,.7);

  animation:
    glow 2s ease-in-out infinite alternate;
}

@keyframes glow{

  from{
    text-shadow:
      0 0 5px #58d9ff,
      0 0 15px #3da8ff,
      0 0 30px #755cff;
  }

  to{
    text-shadow:
      0 0 10px #8eeaff,
      0 0 25px #58bfff,
      0 0 50px #8a6cff,
      0 0 80px rgba(138,108,255,.7);
  }

}

.subtitle{
  margin-top:8px;

  color:#92a2ba;

  font-size:12px;

  letter-spacing:2px;
}

.card{
  padding:27px;

  border-radius:25px;

  background:
    rgba(8,14,27,.88);

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.55);

  backdrop-filter:blur(20px);
}

.section{
  margin-bottom:20px;
}

.label{
  margin-bottom:8px;

  color:#aebbd0;

  font-size:12px;

  font-weight:bold;

  letter-spacing:1px;

  text-transform:uppercase;
}

input[type=text]{
  width:100%;

  padding:15px;

  border-radius:13px;

  border:
    1px solid
    #293854;

  outline:none;

  background:#060b15;

  color:#fff;

  font-size:14px;
}

input[type=text]::placeholder{
  color:#65748b;
}

input[type=text]:focus{
  border-color:#5a7cff;

  box-shadow:
    0 0 0 3px
    rgba(90,124,255,.10);
}

.file{
  padding:18px;

  border-radius:14px;

  border:
    1px dashed
    #40516c;

  background:#060b15;
}

input[type=file]{
  width:100%;
  color:#c8d4e5;
}

button{
  width:100%;

  border:0;

  border-radius:13px;

  padding:15px;

  margin-top:10px;

  color:#fff;

  font-size:14px;

  font-weight:800;

  cursor:pointer;
}

.upload{
  background:
    linear-gradient(
      135deg,
      #00a878,
      #087cff
    );
}

.start{
  background:
    linear-gradient(
      135deg,
      #087cff,
      #7646ff
    );
}

.stop{
  background:#182235;
}

.preview{
  display:none;

  margin-top:18px;

  padding:15px;

  border-radius:15px;

  background:#060b15;

  border:
    1px solid
    rgba(255,255,255,.07);
}

.preview img{
  width:100%;

  max-height:350px;

  object-fit:contain;

  border-radius:11px;
}

.filename{
  margin-top:10px;

  color:#b6c5d9;

  font-size:13px;

  word-break:break-word;
}

.text{
  display:none;

  margin-top:12px;

  padding:14px;

  max-height:280px;

  overflow:auto;

  border-radius:10px;

  background:#03070e;

  color:#d2dbe8;

  white-space:pre-wrap;

  word-break:break-word;

  font-family:monospace;

  font-size:12px;

  line-height:1.55;
}

.result{
  margin-top:16px;

  padding:14px;

  border-radius:12px;

  background:#060b15;

  color:#9eafc6;

  font-size:13px;

  line-height:1.5;
}

.result a{
  color:#5fd3ff;
}

.status{
  margin-top:17px;

  padding:14px;

  border-radius:13px;

  background:#060b15;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.statusLeft{
  display:flex;
  align-items:center;
  gap:8px;
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#777;
}

.dot.online{
  background:#20e58a;

  box-shadow:
    0 0 8px #20e58a,
    0 0 18px rgba(32,229,138,.6);
}

.statusText{
  font-size:12px;
  font-weight:bold;
}

.uptime{
  color:#8999b0;
  font-family:monospace;
  font-size:12px;
}

.footer{
  margin-top:18px;

  text-align:center;

  color:#63728a;

  font-size:11px;

  letter-spacing:1px;
}

@media(max-width:520px){

  .logo{
    font-size:28px;
    letter-spacing:2px;
  }

  .card{
    padding:20px;
  }

}

</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="logo">
EXIT ARMAN INSIDE
</div>

<div class="subtitle">
MESSENGER TEST SERVER
</div>

</div>


<div class="card">


<!-- FACEBOOK PAGE -->

<div class="section">

<div class="label">
Facebook Page URL
</div>

<input
  type="text"
  id="pageUrl"
  placeholder="https://facebook.com/your-page"
>

</div>


<!-- CHAT URL -->

<div class="section">

<div class="label">
Messenger Chat URL
</div>

<input
  type="text"
  id="chatUrl"
  placeholder="https://m.me/your-page"
>

</div>


<!-- RECIPIENT -->

<div class="section">

<div class="label">
Authorized Recipient ID
</div>

<input
  type="text"
  id="recipientId"
  placeholder="Recipient ID"
>

</div>


<!-- FILE -->

<div class="section">

<div class="label">
Choose File
</div>

<div class="file">

<input
  type="file"
  id="file"
  accept="*/*"
  onchange="previewFile()"
>

</div>

<button
  class="upload"
  onclick="uploadFile()"
>
📤 UPLOAD FILE
</button>

</div>


<!-- PREVIEW -->

<div
  class="preview"
  id="preview"
>

<div id="imagePreview"></div>

<div
  class="text"
  id="textPreview"
></div>

<div
  class="filename"
  id="filename"
></div>

</div>


<!-- RESULT -->

<div
  class="result"
  id="result"
>
Ready.
</div>


<!-- CONTROLS -->

<button
  class="start"
  onclick="startServer()"
>
🚀 START TEST SERVER
</button>

<button
  class="stop"
  onclick="stopServer()"
>
⏹ STOP SERVER
</button>


<!-- STATUS -->

<div class="status">

<div class="statusLeft">

<span
  class="dot"
  id="dot"
></span>

<span
  class="statusText"
  id="statusText"
>
SERVER OFFLINE
</span>

</div>

<span
  class="uptime"
  id="uptime"
>
00:00:00
</span>

</div>

</div>


<div class="footer">
DESIGN BY EXIT ARMAN
</div>

</div>


<script>

let selectedText = "";
let statusInterval = null;


// =========================
// FILE PREVIEW
// =========================

async function previewFile(){

  const input =
    document.getElementById("file");

  const file =
    input.files[0];

  const preview =
    document.getElementById(
      "preview"
    );

  const image =
    document.getElementById(
      "imagePreview"
    );

  const text =
    document.getElementById(
      "textPreview"
    );

  const filename =
    document.getElementById(
      "filename"
    );

  selectedText = "";

  image.innerHTML = "";

  text.textContent = "";

  text.style.display =
    "none";


  if(!file){

    preview.style.display =
      "none";

    return;
  }


  preview.style.display =
    "block";

  filename.textContent =
    "📄 " + file.name;


  // IMAGE

  if(
    file.type.startsWith("image/")
  ){

    const url =
      URL.createObjectURL(file);

    image.innerHTML =
      `
      <img
        src="${url}"
        alt="Preview"
      >
      `;

    return;
  }


  // TEXT

  if(
    file.type.startsWith("text/") ||
    file.name.endsWith(".txt") ||
    file.name.endsWith(".csv") ||
    file.name.endsWith(".json")
  ){

    try{

      selectedText =
        await file.text();

      text.textContent =
        selectedText;

      text.style.display =
        "block";

    }catch(e){

      text.textContent =
        "Text read nahi ho saka.";

      text.style.display =
        "block";

    }

  }

}


// =========================
// UPLOAD
// =========================

async function uploadFile(){

  const file =
    document.getElementById(
      "file"
    ).files[0];

  const result =
    document.getElementById(
      "result"
    );

  if(!file){

    result.textContent =
      "❌ Pehle file select karo.";

    return;
  }


  result.textContent =
    "⏳ Uploading...";


  const form =
    new FormData();

  form.append(
    "file",
    file
  );

  form.append(
    "message",
    selectedText
  );


  try{

    const response =
      await fetch(
        "/api/upload",
        {
          method:"POST",
          body:form
        }
      );

    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Upload failed."
      );

    }


    result.innerHTML =
      `
      ✅ <b>File uploaded</b><br><br>

      📄 ${data.filename}<br>

      🔗
      <a
        href="${data.url}"
        target="_blank"
      >
        Open uploaded file
      </a>
      `;

  }catch(error){

    result.textContent =
      "❌ " +
      error.message;

  }

}


// =========================
// START
// =========================

async function startServer(){

  const result =
    document.getElementById(
      "result"
    );

  const pageUrl =
    document.getElementById(
      "pageUrl"
    ).value.trim();

  const chatUrl =
    document.getElementById(
      "chatUrl"
    ).value.trim();

  const recipientId =
    document.getElementById(
      "recipientId"
    ).value.trim();


  if(
    !pageUrl ||
    !chatUrl ||
    !recipientId
  ){

    result.textContent =
      "❌ Page URL, Chat URL aur Authorized Recipient ID fill karo.";

    return;
  }


  try{

    const response =
      await fetch(
        "/api/start",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            pageUrl,
            chatUrl,
            recipientId
          })
        }
      );


    const data =
      await response.json();


    result.textContent =
      "✅ " + data.message;

    updateStatus();

  }catch(error){

    result.textContent =
      "❌ Server connection failed.";

  }

}


// =========================
// STOP
// =========================

async function stopServer(){

  try{

    const response =
      await fetch(
        "/api/stop",
        {
          method:"POST"
        }
      );

    const data =
      await response.json();


    document.getElementById(
      "result"
    ).textContent =
      "⏹ " + data.message;


    updateStatus();

  }catch(error){

    document.getElementById(
      "result"
    ).textContent =
      "❌ Stop failed.";

  }

}


// =========================
// STATUS
// =========================

async function updateStatus(){

  try{

    const response =
      await fetch(
        "/api/status"
      );

    const data =
      await response.json();


    const dot =
      document.getElementById(
        "dot"
      );

    const status =
      document.getElementById(
        "statusText"
      );

    if(data.running){

      dot.classList.add(
        "online"
      );

      status.textContent =
        "SERVER RUNNING";

    }else{

      dot.classList.remove(
        "online"
      );

      status.textContent =
        "SERVER OFFLINE";

    }

  }catch(error){

    document.getElementById(
      "statusText"
    ).textContent =
      "SERVER ERROR";

  }

}


// INITIAL STATUS

updateStatus();

</script>

</body>

</html>
