<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>EXIT ARMAN • Messenger Server</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(0,153,255,.25),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(137,43,226,.22),
      transparent 35%
    ),
    #050812;

  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.wrapper{
  width:100%;
  max-width:560px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:4px;

  background:
    linear-gradient(
      90deg,
      #62d9ff,
      #8d6cff,
      #d66cff
    );

  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{
  color:#8995ab;
  margin-top:7px;
}

.card{
  padding:28px;

  border-radius:25px;

  border:1px solid
    rgba(255,255,255,.10);

  background:
    rgba(10,15,28,.78);

  backdrop-filter:blur(20px);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55);
}

.section{
  margin-bottom:25px;
}

.section-title{
  font-size:13px;
  color:#8d9bb5;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:10px;
}

input,
textarea{
  width:100%;

  border:1px solid #26334d;

  background:#080e1b;

  color:white;

  padding:14px;

  border-radius:13px;

  outline:none;

  font-size:15px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#617cff;
}

.file-box{
  padding:18px;

  border:1px dashed #3c4d6c;

  border-radius:15px;

  background:#080e1b;
}

input[type="file"]{
  border:0;
  padding:5px 0;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  flex:1;

  padding:15px;

  border:0;

  border-radius:13px;

  color:white;

  font-size:15px;

  font-weight:800;

  cursor:pointer;
}

.start{
  background:
    linear-gradient(
      135deg,
      #087cff,
      #7a43ff
    );
}

.stop{
  background:#1a2232;
}

.upload{
  background:
    linear-gradient(
      135deg,
      #00a878,
      #007bff
    );
}

button:active{
  transform:scale(.98);
}

.status{
  margin-top:20px;

  padding:15px;

  border-radius:15px;

  background:#070c17;

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.status-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#777;
}

.dot.online{
  background:#20e58a;

  box-shadow:
    0 0 15px #20e58a;
}

#statusText{
  font-size:13px;
  font-weight:bold;
}

#uptime{
  color:#8d9bb5;
  font-family:monospace;
}

.result{
  margin-top:15px;

  padding:13px;

  border-radius:12px;

  background:#080e19;

  color:#9eb0ca;

  font-size:14px;

  word-break:break-word;
}

.result a{
  color:#5bcaff;
}

.footer{
  text-align:center;

  margin-top:18px;

  color:#65728a;

  font-size:12px;
}

</style>

</head>

<body>

<div class="wrapper">

  <div class="header">

    <div class="logo">
      EXIT ARMAN
    </div>

    <div class="subtitle">
      Messenger Automation Server
    </div>

  </div>


  <div class="card">


    <!-- FILE UPLOAD -->

    <div class="section">

      <div class="section-title">
        Upload File
      </div>

      <div class="file-box">

        <input
          type="file"
          id="file"
        >

      </div>

      <br>

      <button
        class="upload"
        onclick="uploadFile()"
      >
        📤 UPLOAD FILE
      </button>

    </div>


    <!-- RECIPIENT -->

    <div class="section">

      <div class="section-title">
        Messenger Recipient ID
      </div>

      <input
        id="recipientId"
        placeholder="Approved recipient ID"
      >

    </div>


    <!-- MESSAGE -->

    <div class="section">

      <div class="section-title">
        Message
      </div>

      <textarea
        id="message"
        placeholder="Type your message..."
      ></textarea>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

      <button
        class="start"
        onclick="startServer()"
      >
        🚀 START
      </button>

      <button
        class="stop"
        onclick="stopServer()"
      >
        ⏹ STOP
      </button>

    </div>


    <!-- STATUS -->

    <div class="status">

      <div class="status-left">

        <span
          id="dot"
          class="dot"
        ></span>

        <span id="statusText">
          OFFLINE
        </span>

      </div>

      <span id="uptime">
        00:00:00
      </span>

    </div>


    <div
      id="result"
      class="result"
    >
      Server ready.
    </div>

  </div>


  <div class="footer">
    Design by Exit Arman
  </div>

</div>


<script>

let statusTimer = null;


// ==========================
// FORMAT TIME
// ==========================

function formatTime(ms){

  let totalSeconds =
    Math.floor(ms / 1000);

  let hours =
    Math.floor(totalSeconds / 3600);

  let minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  let seconds =
    totalSeconds % 60;

  return (
    String(hours).padStart(2,"0")
    + ":" +
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0")
  );
}


// ==========================
// UPLOAD
// ==========================

async function uploadFile(){

  const file =
    document.getElementById("file").files[0];

  const result =
    document.getElementById("result");

  if(!file){

    result.textContent =
      "❌ Pehle file select karo.";

    return;
  }

  result.textContent =
    "Uploading...";

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  try{

    const response =
      await fetch(
        "/api/upload",
        {
          method:"POST",
          body:formData
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "Upload failed"
      );
    }

    result.innerHTML =
      `
      ✅ File uploaded successfully.<br><br>
      <a
        href="${data.url}"
        target="_blank"
      >
        Open uploaded file
      </a>
      `;

  }catch(error){

    result.textContent =
      "❌ " + error.message;

  }

}


// ==========================
// START
// ==========================

async function startServer(){

  const result =
    document.getElementById("result");

  result.textContent =
    "Starting server...";

  try{

    const response =
      await fetch(
        "/api/start",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          }
        }
      );

    const data =
      await response.json();

    result.textContent =
      data.success
        ? "✅ " + data.message
        : "❌ " + data.error;

    updateStatus();

  }catch(error){

    result.textContent =
      "❌ Server error.";

  }

}


// ==========================
// STOP
// ==========================

async function stopServer(){

  const result =
    document.getElementById("result");

  try{

    const response =
      await fetch(
        "/api/stop",
        {
          method:"POST"
        }
      );

    const data =
      await response.json();

    result.textContent =
      "⏹ " + data.message;

    updateStatus();

  }catch(error){

    result.textContent =
      "❌ Stop failed.";

  }

}


// ==========================
// STATUS
// ==========================

async function updateStatus(){

  try{

    const response =
      await fetch("/api/status");

    const data =
      await response.json();

    const dot =
      document.getElementById("dot");

    const statusText =
      document.getElementById(
        "statusText"
      );

    const uptime =
      document.getElementById(
        "uptime"
      );

    if(data.running){

      dot.classList.add("online");

      statusText.textContent =
        "SERVER RUNNING";

      clearInterval(statusTimer);

      statusTimer =
        setInterval(() => {

          if(data.startedAt){

            uptime.textContent =
              formatTime(
                Date.now() -
                data.startedAt
              );

          }

        },1000);

    }else{

      dot.classList.remove("online");

      statusText.textContent =
        "OFFLINE";

      uptime.textContent =
        "00:00:00";

      clearInterval(statusTimer);

    }

  }catch(error){

    console.log(error);

  }

}

updateStatus();

</script>

</body>

</html>
