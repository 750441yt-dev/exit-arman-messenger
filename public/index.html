<div class="section">

  <div class="label">
    URL
  </div>

  <input
    type="text"
    id="targetUrl"
    placeholder="Paste URL here..."
  >

</div>


<div class="section">

  <div class="label">
    FILE
  </div>

  <div class="file">

    <input
      type="file"
      id="file"
      accept="*/*"
      onchange="previewFile()"
    >

  </div>

  <button
    class="upload"
    onclick="uploadFile()"
  >
    📤 UPLOAD FILE
  </button>

</div>
