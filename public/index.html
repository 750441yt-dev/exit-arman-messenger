<div class="section">
  <div class="section-title">Upload Text File</div>

  <div class="file-box">
    <input
      type="file"
      id="file"
      accept=".txt,.csv,.json"
    >
  </div>

  <br>

  <button
    class="upload"
    onclick="uploadFile()"
  >
    📤 UPLOAD & SEND
  </button>
</div>

<div id="result" class="result">
  Select a text file.
</div>
